# Hermes Agent (NousResearch) — Telegram gateway via long polling: no inbound
# port, no Traefik labels needed. .env written by the pipeline: TELEGRAM_* from
# the shared secrets, LLM API keys from the ENV_hermes secret.
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: gateway run
    env_file: .env
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    volumes:
      - /opt/data/hermes:/opt/data
