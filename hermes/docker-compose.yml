# Hermes Agent (NousResearch). Two processes sharing /opt/data/hermes:
#   gateway   — Telegram long polling, outbound only, no HTTP
#   dashboard — web UI, served at hermes.<domain> behind basic auth
# Image is built from docker/hermes/ and pushed to GHCR as <folder-name>.
# .env is written by the pipeline: TELEGRAM_* from the shared secrets,
# LLM API keys + HERMES_BASIC_AUTH from the ENV_hermes secret, GHCR_OWNER.
services:
  hermes:
    image: ghcr.io/${GHCR_OWNER}/hermes:${TAG:-latest}
    restart: unless-stopped
    command: gateway run
    env_file: .env
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    volumes:
      - /opt/data/hermes:/opt/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Traefik network `proxy` ≠ Hermes egress `proxy.enabled`. This
      # stack does not run iron-proxy; flip the switch off on boot so
      # Docker sandboxes don't fail-closed.
      - ./cont-init/03-disable-egress:/etc/cont-init.d/03-disable-egress:ro
    networks: [proxy]

  dashboard:
    image: ghcr.io/${GHCR_OWNER}/hermes:${TAG:-latest}
    restart: unless-stopped
    # ponytail: --port assumed supported; if the container logs a CLI usage
    # error, check `hermes dashboard --help` for the real flag/default port
    command: dashboard --host 0.0.0.0 --port 3000 --no-open
    env_file: .env
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    volumes:
      - /opt/data/hermes:/opt/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [hermes]
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.hermes.rule: Host(`hermes.${DOMAIN}`)
      traefik.http.routers.hermes.tls.certresolver: le
      traefik.http.routers.hermes.middlewares: internal-only@file
      # auth is handled by the dashboard itself (HERMES_DASHBOARD_BASIC_AUTH_*
      # env vars from the ENV_hermes secret)
      traefik.http.services.hermes.loadbalancer.server.port: "3000"

networks:
  proxy:
    external: true
