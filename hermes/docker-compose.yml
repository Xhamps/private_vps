# Hermes Agent (NousResearch) — Telegram gateway via long polling. .env is
# written by the pipeline: TELEGRAM_* from the shared secrets, LLM API keys
# from the ENV_hermes secret.
services:
  hermes:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped
    command: gateway run
    env_file: .env
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
    volumes:
      - /opt/data/hermes:/opt/data
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.hermes.rule: Host(`hermes.${DOMAIN}`)
      traefik.http.routers.hermes.tls.certresolver: le
      # basic auth in front of whatever hermes serves; hash comes from the
      # HERMES_BASIC_AUTH line in the ENV_hermes secret (htpasswd -nB, $ -> $$)
      traefik.http.routers.hermes.middlewares: hermes-auth
      traefik.http.middlewares.hermes-auth.basicauth.users: ${HERMES_BASIC_AUTH}
      # ponytail: 3000 is a guess — the gateway may not serve HTTP at all
      # (Telegram uses long polling); if https://hermes.<domain> 502s, check
      # the real port with `docker logs` or drop these labels
      traefik.http.services.hermes.loadbalancer.server.port: "3000"

networks:
  proxy:
    external: true
