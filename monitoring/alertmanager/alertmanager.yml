# Telegram receiver. The pipeline supplies both credentials from Actions
# secrets: TELEGRAM_BOT_TOKEN -> token file on the VPS, TELEGRAM_CHAT_ID ->
# replaces the chat_id placeholder below before the file ships.
route:
  receiver: telegram
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /alertmanager/telegram.token
        chat_id: 0            # placeholder — replaced from TELEGRAM_CHAT_ID at deploy
        parse_mode: HTML
