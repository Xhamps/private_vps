# n8n workflow automation — UI + webhooks at n8n.<domain>. Auth is n8n's own
# owner account (created on first visit). Extra env (SMTP, encryption key,
# etc.) can go in the ENV_n8n secret.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    env_file: .env
    environment:
      N8N_HOST: n8n.${DOMAIN}
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    volumes:
      - /opt/data/n8n:/home/node/.n8n
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.http.routers.n8n.rule: Host(`n8n.${DOMAIN}`)
      traefik.http.routers.n8n.tls.certresolver: le
      traefik.http.routers.n8n.middlewares: internal-only@file
      traefik.http.services.n8n.loadbalancer.server.port: "5678"

networks:
  proxy:
    external: true
