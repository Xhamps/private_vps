name: deploy-infra

on:
  push:
    branches: [main]

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [traefik, monitoring]
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync ${{ matrix.stack }} config
        run: |
          rsync -az --delete --exclude='.env' \
            ${{ matrix.stack }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/infra/

      - name: Deploy ${{ matrix.stack }} stack
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/infra/${{ matrix.stack }} && docker compose up -d --remove-orphans"
