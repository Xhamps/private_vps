name: deploy-infra

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stack:
        description: "Stack to deploy (empty = all)"
        required: false
        default: ""

concurrency: deploy

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [traefik, monitoring, hermes, n8n, keycloak, wazuh, twingate, litellm]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ponytail: deploy everything when the before-sha is unknown (force push, first push)
      - name: Check for ${{ matrix.stack }} changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_STACK: ${{ inputs.stack }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          STACK: ${{ matrix.stack }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "${DISPATCH_STACK:-}" ] || [ "$DISPATCH_STACK" = "$STACK" ]; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "workflow_dispatch stack=$DISPATCH_STACK — skipping $STACK"
            fi
            exit 0
          fi
          # Image rebuild in this commit: skip now. docker-images.yml publishes
          # the tag then dispatches this workflow with stack=<name>.
          if [ -f "docker/$STACK/Dockerfile" ] \
             && { [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
                  || ! git cat-file -e "$BEFORE" 2>/dev/null \
                  || ! git diff --quiet "$BEFORE" "$SHA" -- "docker/$STACK"; }; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "docker/$STACK changed — waiting for docker-images to dispatch deploy"
            exit 0
          fi
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE" 2>/dev/null \
             || ! git diff --quiet "$BEFORE" "$SHA" -- "$STACK"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes in $STACK/ — skipping deploy"
          fi

      - name: Set up SSH
        if: steps.diff.outputs.changed == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          {
            echo "Host ${SSH_HOST}"
            echo "  ServerAliveInterval 30"
            echo "  ServerAliveCountMax 30"
            echo "  TCPKeepAlive yes"
          } >> ~/.ssh/config
          chmod 600 ~/.ssh/config
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 10 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts && break
            echo "ssh-keyscan attempt $i failed; retrying in 10s"; sleep 10
          done
          grep -q . ~/.ssh/known_hosts || { echo "VPS unreachable on :22"; exit 1; }

      # chat_id: sed into the local alertmanager.yml before rsync ships it.
      # token: written to /opt/data via sudo stdin (never in argv/logs),
      # alertmanager restarted only when it changed.
      - name: Configure Telegram alerts
        if: steps.diff.outputs.changed == 'true' && matrix.stack == 'monitoring'
        env:
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -n "$CHAT_ID" ]; then
            sed -i "s/chat_id: 0 /chat_id: $CHAT_ID /" monitoring/alertmanager/alertmanager.yml
            grep -q "chat_id: $CHAT_ID" monitoring/alertmanager/alertmanager.yml \
              || { echo "chat_id replacement failed"; exit 1; }
          else
            echo "no TELEGRAM_CHAT_ID secret — leaving placeholder"
          fi
          if [ -n "$TOKEN" ]; then
            printf '%s\n' "$TOKEN" | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
              sudo install -m 600 -o 65534 -g 65534 /dev/stdin /opt/data/alertmanager/telegram.token.new &&
              sudo bash -c '
                t=/opt/data/alertmanager/telegram.token
                if cmp -s \"\$t.new\" \"\$t\" 2>/dev/null; then
                  rm \"\$t.new\"
                else
                  mv \"\$t.new\" \"\$t\"
                  cd /opt/infra/monitoring && docker compose restart alertmanager 2>/dev/null || true
                fi'"
          else
            echo "no TELEGRAM_BOT_TOKEN secret — skipping token"
          fi

      - name: Sync ${{ matrix.stack }} config
        if: steps.diff.outputs.changed == 'true'
        run: |
          rsync -az --delete --exclude='.env' \
            ${{ matrix.stack }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/infra/

      # .env assembled from GitHub config at every deploy: DOMAIN from a repo
      # variable, plus the ENV_<stack> secret (multiline KEY=value block) when
      # one exists. The hermes stack additionally gets the shared Telegram
      # secrets.
      - name: Inject ${{ matrix.stack }} .env
        if: steps.diff.outputs.changed == 'true'
        env:
          ENV_SECRETS: ${{ secrets[format('ENV_{0}', matrix.stack)] }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          { echo "DOMAIN=${{ vars.DOMAIN }}"
            echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}"
            if [ -n "$ENV_SECRETS" ]; then printf '%s\n' "$ENV_SECRETS"; fi
            if [ "${{ matrix.stack }}" = "hermes" ]; then
              echo "TELEGRAM_BOT_TOKEN=$TG_TOKEN"
              echo "TELEGRAM_ALLOWED_USERS=$TG_CHAT"
              echo "TELEGRAM_HOME_CHANNEL=$TG_CHAT"
            fi
            # Twingate Resources use public DNS; connector hairpins to this IP.
            # SSH_HOST must be the numeric VPS IP (not a hostname).
            if [ "${{ matrix.stack }}" = "traefik" ]; then
              echo "VPS_PUBLIC_IP=${{ secrets.SSH_HOST }}"
            fi
          } | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "umask 077 && cat > /opt/infra/${{ matrix.stack }}/.env"

      # Render Traefik dynamic.yml (allowlist includes VPS_PUBLIC_IP for Twingate hairpin).
      - name: Render Traefik dynamic config
        if: steps.diff.outputs.changed == 'true' && matrix.stack == 'traefik'
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -euo pipefail
            cd /opt/infra/traefik
            set -a && source .env && set +a
            : "${VPS_PUBLIC_IP:?missing VPS_PUBLIC_IP in traefik .env}"
            case "$VPS_PUBLIC_IP" in
              *[a-zA-Z]*)
                echo "VPS_PUBLIC_IP must be a numeric IP (SSH_HOST), got: $VPS_PUBLIC_IP" >&2
                exit 1
                ;;
            esac
            command -v envsubst >/dev/null || sudo apt-get install -yq gettext-base
            envsubst '\''$VPS_PUBLIC_IP'\'' < dynamic.yml.tmpl > dynamic.yml
            grep -q "$VPS_PUBLIC_IP/32" dynamic.yml
          '

      # Certs/SAML/authd + agent live in bootstrap.sh (BOOTSTRAP_WAZUH_ONLY=1).
      # Needs wazuh/ synced and .env injected first.
      - name: Wazuh host prep
        if: steps.diff.outputs.changed == 'true' && matrix.stack == 'wazuh'
        run: |
          scp bootstrap.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/bootstrap.sh
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo BOOTSTRAP_WAZUH_ONLY=1 bash /tmp/bootstrap.sh"

      - name: Deploy ${{ matrix.stack }} stack
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            cd /opt/infra/${{ matrix.stack }}
            if grep -q ghcr.io docker-compose.yml; then
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
              if docker compose pull; then
                docker compose up -d --remove-orphans
              else
                echo 'GHCR image not published yet; docker-images will re-trigger deploy'
              fi
              docker logout ghcr.io
            else
              docker compose up -d --remove-orphans
            fi
          "

      # Manager may still be warming up — poll before agent enroll.
      - name: Wazuh agent enroll
        if: steps.diff.outputs.changed == 'true' && matrix.stack == 'wazuh'
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            set -e
            cd /opt/infra/wazuh
            for i in \$(seq 1 36); do
              if docker compose exec -T wazuh.manager /var/ossec/bin/wazuh-control status >/dev/null 2>&1; then
                echo manager healthy after \${i}0s
                break
              fi
              echo waiting for manager... \${i}/36
              sleep 10
            done
            sudo BOOTSTRAP_WAZUH_ONLY=1 bash /tmp/bootstrap.sh
          "
