name: deploy-infra

on:
  push:
    branches: [main]

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [traefik, monitoring]
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 10 -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts && break
            echo "ssh-keyscan attempt $i failed; retrying in 10s"; sleep 10
          done
          grep -q . ~/.ssh/known_hosts || { echo "VPS unreachable on :22"; exit 1; }

      # chat_id placeholder is filled from the TELEGRAM_CHAT_ID secret before
      # the file ships to the VPS
      - name: Set Telegram chat id
        if: matrix.stack == 'monitoring'
        env:
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$CHAT_ID" ]; then
            echo "no TELEGRAM_CHAT_ID secret — leaving placeholder"
            exit 0
          fi
          sed -i "s/^\( *chat_id:\) 0$/\1 $CHAT_ID/" monitoring/alertmanager/alertmanager.yml

      - name: Sync ${{ matrix.stack }} config
        run: |
          rsync -az --delete --exclude='.env' \
            ${{ matrix.stack }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/infra/

      # .env assembled from GitHub config at every deploy: DOMAIN from a repo
      # variable, secrets from an ENV_<stack> secret (multiline KEY=value block).
      # Skipped when the stack has no ENV_<stack> secret (e.g. traefik).
      - name: Inject ${{ matrix.stack }} .env
        env:
          ENV_SECRETS: ${{ secrets[format('ENV_{0}', matrix.stack)] }}
        run: |
          if [ -z "$ENV_SECRETS" ]; then
            echo "no ENV_${{ matrix.stack }} secret — skipping .env"
            exit 0
          fi
          { echo "DOMAIN=${{ vars.DOMAIN }}"; printf '%s\n' "$ENV_SECRETS"; } | \
            ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "umask 077 && cat > /opt/infra/${{ matrix.stack }}/.env"

      # token lives in /opt/data (persistent, root-managed); written via sudo
      # stdin so it never appears in argv or logs, restart only on change
      - name: Inject Telegram bot token
        if: matrix.stack == 'monitoring'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "no TELEGRAM_BOT_TOKEN secret — skipping"
            exit 0
          fi
          printf '%s\n' "$TOKEN" | ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "
            sudo install -m 600 -o 65534 -g 65534 /dev/stdin /opt/data/alertmanager/telegram.token.new &&
            sudo bash -c '
              t=/opt/data/alertmanager/telegram.token
              if cmp -s \"\$t.new\" \"\$t\" 2>/dev/null; then
                rm \"\$t.new\"
              else
                mv \"\$t.new\" \"\$t\"
                cd /opt/infra/monitoring && docker compose restart alertmanager 2>/dev/null || true
              fi'"

      - name: Deploy ${{ matrix.stack }} stack
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/infra/${{ matrix.stack }} && docker compose up -d --remove-orphans"

      # compose up doesn't restart on bind-mounted config changes; SIGHUP makes
      # alertmanager re-read its config every deploy
      - name: Reload alertmanager config
        if: matrix.stack == 'monitoring'
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/infra/monitoring && docker compose kill -s SIGHUP alertmanager || true"
