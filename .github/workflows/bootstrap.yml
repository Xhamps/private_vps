name: bootstrap-server

# Re-runs bootstrap.sh (idempotent) whenever it changes, or on demand
# from the Actions tab. First-ever run must still be done manually as
# root (it creates the deploy user + sudoers this workflow relies on).
on:
  push:
    branches: [main]
    paths: [bootstrap.sh]
  workflow_dispatch:

concurrency: deploy

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Run bootstrap
        run: |
          scp bootstrap.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:bootstrap.sh
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo bash ~/bootstrap.sh && rm ~/bootstrap.sh"
