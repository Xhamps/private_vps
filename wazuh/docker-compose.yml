# Wazuh 4.14.7 single-node. Dashboard at wazuh.<domain> via Traefik.
# Manager 1514/1515 bound to 127.0.0.1 only — host agent, not the internet.
# Requires /opt/infra/wazuh/.env from ENV_wazuh + DOMAIN.
services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.7
    hostname: wazuh.indexer
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /opt/data/wazuh/indexer:/var/lib/wazuh-indexer
      - /opt/data/wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - /opt/data/wazuh/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - /opt/data/wazuh/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - /opt/data/wazuh/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - /opt/data/wazuh/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
      - /opt/data/wazuh/indexer-security/config.yml:/usr/share/wazuh-indexer/config/opensearch-security/config.yml:ro
      - /opt/data/wazuh/indexer-security/roles_mapping.yml:/usr/share/wazuh-indexer/config/opensearch-security/roles_mapping.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks: [internal]

  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.7
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "127.0.0.1:1514:1514"
      - "127.0.0.1:1515:1515"
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${INDEXER_PASSWORD}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${API_PASSWORD}
    volumes:
      - /opt/data/wazuh/manager/api:/var/ossec/api/configuration
      - /opt/data/wazuh/manager/etc:/var/ossec/etc
      - /opt/data/wazuh/manager/logs:/var/ossec/logs
      - /opt/data/wazuh/manager/queue:/var/ossec/queue
      - /opt/data/wazuh/manager/var:/var/ossec/var/multigroups
      - /opt/data/wazuh/manager/integrations:/var/ossec/integrations
      - /opt/data/wazuh/manager/active-response:/var/ossec/active-response/bin
      - /opt/data/wazuh/manager/agentless:/var/ossec/agentless
      - /opt/data/wazuh/manager/wodles:/var/ossec/wodles
      - /opt/data/wazuh/manager/filebeat-etc:/etc/filebeat
      - /opt/data/wazuh/manager/filebeat-var:/var/lib/filebeat
      - /opt/data/wazuh/certs/root-ca.pem:/etc/ssl/root-ca.pem:ro
      - /opt/data/wazuh/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - /opt/data/wazuh/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - /opt/data/wazuh/authd.pass:/var/ossec/etc/authd.pass:ro
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/var/ossec/bin/wazuh-control", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [internal]

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.7
    hostname: wazuh.dashboard
    restart: unless-stopped
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${INDEXER_PASSWORD}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      API_USERNAME: wazuh-wui
      API_PASSWORD: ${API_PASSWORD}
    volumes:
      - /opt/data/wazuh/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - /opt/data/wazuh/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - /opt/data/wazuh/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
      - /opt/data/wazuh/dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - /opt/data/wazuh/dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:5601 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks: [proxy, internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.wazuh.rule: Host(`wazuh.${DOMAIN}`)
      traefik.http.routers.wazuh.tls.certresolver: le
      traefik.http.services.wazuh.loadbalancer.server.port: "5601"
      traefik.http.services.wazuh.loadbalancer.server.scheme: https
      traefik.http.services.wazuh.loadbalancer.serversTransport: wazuh-dashboard@file

networks:
  proxy:
    external: true
  internal: {}
