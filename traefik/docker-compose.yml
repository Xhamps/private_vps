services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    ports:                       # the ONLY stack allowed to publish ports
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - /opt/data/traefik:/acme
    networks:
      - proxy

networks:
  proxy:
    external: true
